name: Test
on: [push, pull_request]
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build without CGO
        shell: bash
        run: CGO_ENABLED=0 go build ./cmd/nicotop
      - name: Unix terminal integration
        if: runner.os != 'Windows'
        run: make integration
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./nicotop.ps1 --json --count 1 --refresh 0.2
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make cross
